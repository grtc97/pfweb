services:
  - type: web
    name: webpf-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CHAT_MODE
        value: openai
      - key: CHAT_RATE_LIMIT
        value: "10"
      - key: CONTACT_MODE
        value: smtp
      - key: CONTACT_EMAIL_TO
        sync: false
      - key: CONTACT_RATE_LIMIT
        value: "5"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
