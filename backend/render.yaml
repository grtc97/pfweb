services:
  - type: web
    name: webpf-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CHAT_MODE
        value: openai
      - key: CHAT_RATE_LIMIT
        value: "10"
      - key: CORS_ORIGINS
        sync: false
